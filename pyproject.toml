[project]
name = "s3-ec2-demo"
version = "0.1.0"
description = "FastAPI + React demo on EC2 with S3 and RDS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "boto3>=1.35.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.9.0",
    "code-review-graph>=2.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
