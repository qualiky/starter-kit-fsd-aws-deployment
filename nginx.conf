server {
    listen 80;
    server_name _;          # Replace with your domain or EC2 public DNS

    # -----------------------------------------------------------------------
    # Frontend — static SPA build
    # -----------------------------------------------------------------------
    root /var/www/postshare/frontend;
    index index.html;

    # Increase upload size limit to match backend (50 MB)
    client_max_body_size 50M;

    # -----------------------------------------------------------------------
    # API proxy — forward /api/* to FastAPI running on localhost:8000
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for large file uploads
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # -----------------------------------------------------------------------
    # SPA fallback — any unknown path serves index.html for client routing
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # Cache static assets aggressively
    # -----------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
